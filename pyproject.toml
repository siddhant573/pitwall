[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitwall-agents"
dynamic = ["version"]
description = "A pit wall for your coding agents: see every session's state on a desk device and jump to the right terminal tab."
readme = "README.md"
keywords = ["claude-code", "coding-agents", "badge", "github-universe", "iterm2", "bluetooth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
license = "MIT"
authors = [{ name = "Siddhant Sinha" }]
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "bleak>=0.22", "mpremote>=1.24", "tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/siddhant573/pitwall"
Repository = "https://github.com/siddhant573/pitwall"
Issues = "https://github.com/siddhant573/pitwall/issues"
Protocol = "https://github.com/siddhant573/pitwall/blob/main/docs/protocol.md"
Changelog = "https://github.com/siddhant573/pitwall/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pitwall = "pitwall.cli:main"
pitwall-hook = "pitwall.hook:main"

[tool.hatch.version]
path = "src/pitwall/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

[tool.hatch.build.targets.wheel.force-include]
"badge/pitwall" = "pitwall/badge_app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
exclude = ["uv.lock"]
